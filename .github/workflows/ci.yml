name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libopencv-dev
      # pigpio (Raspberry Pi GPIO library) is no longer packaged for the
      # runner's Ubuntu release, so build a pinned release from source.
      - name: Build pigpio
        run: |
          git clone --depth 1 --branch v79 https://github.com/joan2937/pigpio.git /tmp/pigpio
          # v79 predates C23 (the new GCC default), where `()` means "no arguments"
          make -C /tmp/pigpio CC="gcc -std=gnu11"
          sudo make -C /tmp/pigpio CC="gcc -std=gnu11" install
          sudo ldconfig
      # Builds the same target a Raspberry Pi would; catches compile and link errors.
      - name: Build
        run: make smarthelmet
